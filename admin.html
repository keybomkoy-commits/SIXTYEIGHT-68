<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | SIXTYEIGHT 68</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #08080a;
      --card-bg: rgba(18, 18, 22, 0.65);
      --border-color: rgba(255, 255, 255, 0.12);
      --accent-white: #ffffff;
      --accent-gray: #8a8a93;
      --danger: #ff4757;
      --success: #2ed573;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body { background-color: var(--bg-main); color: #ffffff; min-height: 100vh; display: flex; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #08080a; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #444; }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: rgba(12, 12, 15, 0.9);
      border-right: 1px solid var(--border-color);
      backdrop-filter: blur(20px);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      z-index: 10;
    }
    .brand-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 2.2rem;
      letter-spacing: 3px;
      text-align: center;
      background: linear-gradient(180deg, #fff 30%, #666 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .nav-btn {
      width: 100%;
      padding: 14px 18px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--accent-gray);
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .nav-btn:hover, .nav-btn.active {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .btn-logout { margin-top: auto; background: rgba(255, 71, 87, 0.1); color: var(--danger); border: 1px solid rgba(255, 71, 87, 0.2); }
    .btn-logout:hover { background: var(--danger); color: #ffffff; border-color: var(--danger); }

    /* Main Content */
    .main-content { flex: 1; padding: 40px 50px; overflow-y: auto; }
    .tab-content { display: none; max-width: 1000px; }
    .tab-content.active { display: block; animation: slideUp 0.4s ease-out; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    .section-header { 
      font-size: 1.6rem; 
      font-weight: 600; 
      letter-spacing: 1px; 
      margin-bottom: 24px; 
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .section-header::before {
      content: '';
      width: 4px;
      height: 24px;
      background: #ffffff;
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 28px;
      backdrop-filter: blur(15px);
      margin-bottom: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--accent-gray); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
    
    .form-input, .form-select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.3s ease;
    }
    .form-select option { background: #121216; color: #fff; }
    .form-input:focus, .form-select:focus { border-color: #ffffff; box-shadow: 0 0 12px rgba(255, 255, 255, 0.2); }

    .btn-save {
      padding: 12px 28px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }
    .btn-save:hover { background: #dddddd; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,255,255,0.2); }

    /* Custom Data Table */
    .table-responsive { width: 100%; overflow-x: auto; }
    .custom-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; text-align: left; }
    .custom-table th, .custom-table td { padding: 16px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    .custom-table th { background: rgba(255, 255, 255, 0.03); color: var(--accent-gray); text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
    .custom-table tr:hover td { background: rgba(255, 255, 255, 0.02); }

    .avatar-wrapper { position: relative; width: 42px; height: 42px; }
    .avatar-preview { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.2); }
    
    .role-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      display: inline-block;
    }

    .btn-del {
      background: rgba(255, 71, 87, 0.15);
      color: var(--danger);
      border: 1px solid rgba(255, 71, 87, 0.3);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }
    .btn-del:hover { background: var(--danger); color: #fff; }

    /* Status Banner */
    .status-msg { display: none; padding: 14px 20px; border-radius: 12px; margin-bottom: 24px; font-size: 0.9rem; font-weight: 500; }
    .status-msg.success { background: rgba(46, 213, 115, 0.15); border: 1px solid var(--success); color: var(--success); }
    .status-msg.error { background: rgba(255, 71, 87, 0.15); border: 1px solid var(--danger); color: var(--danger); }

    @media (max-width: 900px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; }
      .main-content { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- Sidebar Nav -->
  <aside class="sidebar">
    <div class="brand-title">ADMIN PANEL</div>
    <ul class="nav-list">
      <li>
        <button class="nav-btn active" onclick="switchTab('index-tab', this)">
          <i class="fa-solid fa-sliders"></i> ตั้งค่าหน้า Index
        </button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchTab('gang-tab', this)">
          <i class="fa-solid fa-users-gear"></i> จัดการสมาชิก Gang
        </button>
      </li>
      <li>
        <button class="nav-btn" onclick="switchTab('family-tab', this)">
          <i class="fa-solid fa-house-user"></i> จัดการสมาชิก Family
        </button>
      </li>
    </ul>

    <button class="nav-btn btn-logout" onclick="handleLogout()">
      <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
    </button>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <div id="status-box" class="status-msg"></div>

    <!-- Tab 1: Index Page Settings -->
    <section id="index-tab" class="tab-content active">
      <h2 class="section-header">จัดการข้อมูลหน้าเว็บหลัก (Index)</h2>
      <div class="card">
        <form id="form-index" onsubmit="saveIndexSettings(event)">
          <div class="form-group">
            <label>Title ตัวใหญ่ ( Main Header )</label>
            <input type="text" id="cfg-title-large" class="form-input" placeholder="เช่น SIXTYEIGHT 68">
          </div>
          <div class="form-group">
            <label>Title ตัวเล็ก ( Sub Header )</label>
            <input type="text" id="cfg-title-small" class="form-input" placeholder="เช่น OFFICIAL COMMUNITY">
          </div>
          <div class="form-group">
            <label>URL รูปภาพ Background</label>
            <input type="url" id="cfg-bg-url" class="form-input" placeholder="https://example.com/bg.png">
          </div>
          <div class="form-group">
            <label>URL รูปภาพ Logo</label>
            <input type="url" id="cfg-logo-url" class="form-input" placeholder="https://example.com/logo.png">
          </div>
          <div class="form-group">
            <label>FontAwesome Icon Class (ถ้าไม่มี URL Logo)</label>
            <input type="text" id="cfg-logo-icon" class="form-input" placeholder="เช่น fa-solid fa-shield-halved">
          </div>
          <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูลหน้า Index</button>
        </form>
      </div>
    </section>

    <!-- Tab 2: Gang Members -->
    <section id="gang-tab" class="tab-content">
      <h2 class="section-header">จัดการสมาชิก GANG</h2>
      <div class="card">
        <form onsubmit="addMember(event, 'gang_members')">
          <div class="form-grid">
            <div class="form-group">
              <label>ชื่อสมาชิก (Nickname)</label>
              <input type="text" id="gang-name" class="form-input" placeholder="เช่น DNAX" required>
            </div>
            
            <div class="form-group">
              <label>เลือกตำแหน่ง (Role Category)</label>
              <select id="gang-role-select" class="form-select" onchange="toggleCustomRoleInput('gang')" required>
                <option value="">-- เลือกตำแหน่ง --</option>
                <option value="Leader (หัวหน้าแก๊ง)">Leader (หัวหน้าแก๊ง)</option>
                <option value="Co-Leader (รองหัวหน้า)">Co-Leader (รองหัวหน้า)</option>
                <option value="Warlord (สายบวก/คุมสนาม)">Warlord (สายบวก/คุมสนาม)</option>
                <option value="High Roller (ผู้สนับสนุน)">High Roller (ผู้สนับสนุน)</option>
                <option value="Member (สมาชิกหลัก)">Member (สมาชิกหลัก)</option>
                <option value="Initiate (สมาชิกใหม่)">Initiate (สมาชิกใหม่)</option>
                <option value="CUSTOM">-- กำหนดตำแหน่งเอง --</option>
              </select>
            </div>

            <div class="form-group" id="gang-custom-role-container" style="display: none;">
              <label>ระบุตำแหน่งเอง</label>
              <input type="text" id="gang-custom-role" class="form-input" placeholder="เช่น Weapon Specialist">
            </div>

            <div class="form-group">
              <label>URL รูปโปรไฟล์ (เว้นว่างได้ จะใช้รูปเริ่มต้น)</label>
              <input type="url" id="gang-avatar" class="form-input" placeholder="https://...">
            </div>
          </div>
          <button type="submit" class="btn-save"><i class="fa-solid fa-user-plus"></i> เพิ่มสมาชิก Gang</button>
        </form>
      </div>

      <div class="card">
        <h3 style="font-size: 1.1rem; margin-bottom: 16px; color: #ccc;">รายชื่อสมาชิก Gang ทั้งหมด</h3>
        <div class="table-responsive">
          <table class="custom-table">
            <thead>
              <tr>
                <th>รูป</th>
                <th>ชื่อ</th>
                <th>ตำแหน่ง</th>
                <th>วันที่เพิ่ม</th>
                <th>จัดการ</th>
              </tr>
            </thead>
            <tbody id="gang-table-body">
              <tr><td colspan="5" style="text-align:center; color:#666;">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Tab 3: Family Members -->
    <section id="family-tab" class="tab-content">
      <h2 class="section-header">จัดการสมาชิก FAMILY</h2>
      <div class="card">
        <form onsubmit="addMember(event, 'family_members')">
          <div class="form-grid">
            <div class="form-group">
              <label>ชื่อสมาชิก (Nickname)</label>
              <input type="text" id="family-name" class="form-input" placeholder="เช่น Thomas" required>
            </div>
            
            <div class="form-group">
              <label>เลือกตำแหน่ง (Role Category)</label>
              <select id="family-role-select" class="form-select" onchange="toggleCustomRoleInput('family')" required>
                <option value="">-- เลือกตำแหน่ง --</option>
                <option value="Family Head (ผู้นำตระกูล)">Family Head (ผู้นำตระกูล)</option>
                <option value="Elder (อาวุโส)">Elder (อาวุโส)</option>
                <option value="Enforcer (ผู้คุ้มกัน)">Enforcer (ผู้คุ้มกัน)</option>
                <option value="Family Member (สมาชิก)">Family Member (สมาชิก)</option>
                <option value="CUSTOM">-- กำหนดตำแหน่งเอง --</option>
              </select>
            </div>

            <div class="form-group" id="family-custom-role-container" style="display: none;">
              <label>ระบุตำแหน่งเอง</label>
              <input type="text" id="family-custom-role" class="form-input" placeholder="เช่น Secretary">
            </div>

            <div class="form-group">
              <label>URL รูปโปรไฟล์ (เว้นว่างได้ จะใช้รูปเริ่มต้น)</label>
              <input type="url" id="family-avatar" class="form-input" placeholder="https://...">
            </div>
          </div>
          <button type="submit" class="btn-save"><i class="fa-solid fa-user-plus"></i> เพิ่มสมาชิก Family</button>
        </form>
      </div>

      <div class="card">
        <h3 style="font-size: 1.1rem; margin-bottom: 16px; color: #ccc;">รายชื่อสมาชิก Family ทั้งหมด</h3>
        <div class="table-responsive">
          <table class="custom-table">
            <thead>
              <tr>
                <th>รูป</th>
                <th>ชื่อ</th>
                <th>ตำแหน่ง</th>
                <th>วันที่เพิ่ม</th>
                <th>จัดการ</th>
              </tr>
            </thead>
            <tbody id="family-table-body">
              <tr><td colspan="5" style="text-align:center; color:#666;">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- Firebase Integration -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // ** ลิงก์รูปโปรไฟล์เริ่มต้น กรณีผู้ใช้ไม่ได้ใส่ URL รูปภาพมา **
    const DEFAULT_AVATAR_URL = "https://ui-avatars.com/api/?background=222&color=fff&name=";

    const firebaseConfig = {
      apiKey: "AIzaSyAHPEF07_zyE7hwZRPIBbwV_ewTz-xzdRo",
      authDomain: "sixtyeight-68.firebaseapp.com",
      projectId: "sixtyeight-68",
      storageBucket: "sixtyeight-68.firebasestorage.app",
      messagingSenderId: "736729322969",
      appId: "1:736729322969:web:cfa26d6e4be992ffd7f5c8"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    /* Auth State Check */
    auth.onAuthStateChanged((user) => {
      if (!user) {
        window.location.href = "index.html";
      } else {
        loadIndexSettings();
        bindRealtimeMembers('gang_members', 'gang-table-body');
        bindRealtimeMembers('family_members', 'family-table-body');
      }
    });

    /* Tab Switcher */
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    /* Helper: Show Status Message */
    function showStatus(message, type) {
      const box = document.getElementById('status-box');
      box.innerText = message;
      box.className = `status-msg ${type}`;
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 4000);
    }

    /* Toggle Custom Role Input Field */
    function toggleCustomRoleInput(type) {
      const select = document.getElementById(`${type}-role-select`);
      const customContainer = document.getElementById(`${type}-custom-role-container`);
      if (select.value === 'CUSTOM') {
        customContainer.style.display = 'block';
      } else {
        customContainer.style.display = 'none';
      }
    }

    /* --- Index Settings --- */
    function loadIndexSettings() {
      db.collection("settings").doc("index_page").get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          document.getElementById('cfg-title-large').value = data.titleLarge || '';
          document.getElementById('cfg-title-small').value = data.titleSmall || '';
          document.getElementById('cfg-bg-url').value = data.bgUrl || '';
          document.getElementById('cfg-logo-url').value = data.logoUrl || '';
          document.getElementById('cfg-logo-icon').value = data.logoIcon || '';
        }
      });
    }

    function saveIndexSettings(e) {
      e.preventDefault();
      const data = {
        titleLarge: document.getElementById('cfg-title-large').value.trim(),
        titleSmall: document.getElementById('cfg-title-small').value.trim(),
        bgUrl: document.getElementById('cfg-bg-url').value.trim(),
        logoUrl: document.getElementById('cfg-logo-url').value.trim(),
        logoIcon: document.getElementById('cfg-logo-icon').value.trim(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      db.collection("settings").doc("index_page").set(data, { merge: true })
        .then(() => showStatus("บันทึกการตั้งค่าหน้า Index เรียบร้อยแล้ว!", "success"))
        .catch((err) => showStatus("ข้อผิดพลาด: " + err.message, "error"));
    }

    /* --- Member Management --- */

    // 1. ระบบเพิ่มสมาชิก
    function addMember(e, collectionName) {
      e.preventDefault();
      const prefix = collectionName === 'gang_members' ? 'gang' : 'family';
      
      const name = document.getElementById(`${prefix}-name`).value.trim();
      const roleSelect = document.getElementById(`${prefix}-role-select`).value;
      const customRole = document.getElementById(`${prefix}-custom-role`).value.trim();
      let avatarInput = document.getElementById(`${prefix}-avatar`).value.trim();

      // จัดการเรื่องตำแหน่ง
      let finalRole = roleSelect;
      if (roleSelect === 'CUSTOM') {
        if (!customRole) {
          showStatus("กรุณาระบุตำแหน่งเองในช่องที่กำหนด", "error");
          return;
        }
        finalRole = customRole;
      }

      // จัดการเรื่องรูปโปรไฟล์เริ่มต้น (ถ้าไม่ได้ใส่รูปมา จะสร้าง Avatar จากชื่อตัวแรกให้อัตโนมัติ)
      if (!avatarInput) {
        avatarInput = `${DEFAULT_AVATAR_URL}${encodeURIComponent(name)}`;
      }

      db.collection(collectionName).add({
        name: name,
        role: finalRole,
        avatar: avatarInput,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        showStatus(`เพิ่มสมาชิกใน ${collectionName === 'gang_members' ? 'Gang' : 'Family'} เรียบร้อยแล้ว`, "success");
        
        // Reset Form
        document.getElementById(`${prefix}-name`).value = '';
        document.getElementById(`${prefix}-role-select`).value = '';
        document.getElementById(`${prefix}-custom-role`).value = '';
        document.getElementById(`${prefix}-avatar`).value = '';
        document.getElementById(`${prefix}-custom-role-container`).style.display = 'none';
      }).catch(err => showStatus("เกิดข้อผิดพลาด: " + err.message, "error"));
    }

    // 2. ดึงข้อมูลสมาชิกแบบ Realtime มาแสดงในตาราง
    function bindRealtimeMembers(collectionName, tableBodyId) {
      db.collection(collectionName).orderBy("createdAt", "desc").onSnapshot((snapshot) => {
        const tbody = document.getElementById(tableBodyId);
        tbody.innerHTML = '';

        if (snapshot.empty) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#666; padding:30px;">ยังไม่มีรายชื่อสมาชิกในระบบ</td></tr>';
          return;
        }

        snapshot.forEach((doc) => {
          const m = doc.data();
          const dateStr = m.createdAt ? new Date(m.createdAt.toDate()).toLocaleDateString('th-TH') : 'ไม่ระบุ';
          
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>
              <img src="${m.avatar}" class="avatar-preview" onerror="this.src='${DEFAULT_AVATAR_URL}${encodeURIComponent(m.name)}'">
            </td>
            <td style="font-weight: 500; font-size: 0.95rem;">${m.name}</td>
            <td><span class="role-badge">${m.role}</span></td>
            <td style="color: #666; font-size: 0.8rem;">${dateStr}</td>
            <td>
              <button class="btn-del" onclick="deleteMember('${collectionName}', '${doc.id}', '${m.name}')">
                <i class="fa-solid fa-trash"></i> ลบ
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    // 3. ระบบลบสมาชิก
    function deleteMember(collectionName, docId, name) {
      if (confirm(`คุณแน่ใจหรือไม่ว่าต้องการลบคุณ "${name}" ออกจากระบบ?`)) {
        db.collection(collectionName).doc(docId).delete()
          .then(() => showStatus(`ลบคุณ ${name} เรียบร้อยแล้ว`, "success"))
          .catch(err => showStatus("เกิดข้อผิดพลาดในการลบ: " + err.message, "error"));
      }
    }

    /* Logout */
    function handleLogout() {
      auth.signOut().then(() => { window.location.href = "index.html"; });
    }
  </script>
</body>
</html>
