<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RYOSIG 680</title>
  <link id="site-favicon" rel="icon" href="">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; min-height: 100vh; overflow: hidden; background-color: #000000; color: #ffffff; }
    body { display: flex; justify-content: center; align-items: center; position: relative; }

    @keyframes smoothEntrance {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #bg-layer {
      position: absolute; inset: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #000000;
      z-index: 1; filter: brightness(0.35) contrast(1.1); transition: background-image 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .overlay { position: absolute; inset: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.92) 100%); z-index: 2; }
    #particles-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

    .top-nav {
      position: absolute; top: 28px; left: 40px; right: 40px; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      max-width: 1400px; margin: 0 auto; width: calc(100% - 80px);
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px; font-family: 'Bebas Neue', cursive;
      font-size: 1.25rem; letter-spacing: 2px; color: #ffffff; text-decoration: none;
      background: rgba(18, 18, 18, 0.4); padding: 8px 18px; border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px);
    }
    .nav-brand i { color: #d4af37; }
    
    .nav-menu { display: flex; align-items: center; gap: 32px; }
    .nav-link {
      font-size: 0.8rem; font-weight: 500; letter-spacing: 2px; color: #777777; text-decoration: none;
      transition: color 0.3s ease; text-transform: uppercase;
    }
    .nav-link:hover, .nav-link.active { color: #ffffff; }

    .nav-status {
      display: flex; align-items: center; gap: 8px; font-size: 0.75rem; letter-spacing: 1px;
      background: rgba(18, 18, 18, 0.4); padding: 8px 16px; border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); color: #bbb;
    }
    .nav-status-dot { width: 6px; height: 6px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }

    .container { 
      position: relative; z-index: 3; width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 4%; text-align: center; 
      animation: smoothEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .content-layout {
      width: 100%; max-width: 1400px; display: flex; justify-content: space-between; align-items: center; position: relative; margin-top: 30px;
      padding-left: 24px; padding-right: 24px;
    }

    .left-section {
      display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 16px; z-index: 4;
      flex: 1; padding-right: 40px;
    }

    .header-text { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; }
    .title-small { font-size: 0.85rem; color: #d4af37; letter-spacing: 4px; text-transform: uppercase; font-weight: 500; display: none; }
    
    .title-large {
      font-family: 'Bebas Neue', cursive; 
      font-size: clamp(4.5rem, 9.5vw, 8.5rem); 
      letter-spacing: clamp(4px, 1.2vw, 14px);
      line-height: 0.95; 
      text-transform: uppercase;
      width: 100%;
      overflow: visible;
      background: linear-gradient(110deg, #888 0%, #fff 25%, #fff 50%, #888 75%, #fff 100%);
      background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text;
      animation: textShimmer 6s linear infinite;
    }

    @keyframes textShimmer { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }

    .stats-row {
      display: flex; gap: 36px; align-items: center; margin-top: 12px; display: none;
    }
    .stat-item { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
    .stat-value { font-family: 'Bebas Neue', cursive; font-size: 1.7rem; letter-spacing: 2px; color: #ffffff; line-height: 1; }
    .stat-label { font-size: 0.62rem; letter-spacing: 1.6px; color: #888888; font-weight: 500; }

    .right-section {
      display: flex; flex-direction: column; align-items: flex-end; gap: 12px; z-index: 4;
      flex-shrink: 0;
    }
    .enter-label { font-size: 0.65rem; letter-spacing: 3px; color: #777; text-transform: uppercase; font-weight: 500; }

    .btn-group { display: flex; flex-direction: column; gap: 10px; width: 260px; }
    .btn-main {
      width: 100%; padding: 12px 20px; font-size: 0.88rem; font-weight: 500;
      letter-spacing: 2px; color: #ffffff; text-decoration: none; background: rgba(18, 18, 18, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 10px; backdrop-filter: blur(12px);
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1); display: flex; justify-content: space-between; align-items: center;
    }
    .btn-main:hover { background: rgba(255, 255, 255, 0.95); color: #000000; border-color: #ffffff; transform: translateX(-4px); box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15); }
    .btn-main:active { transform: translateX(-1px) scale(0.98); }
    .btn-main i { font-size: 0.78rem; transition: transform 0.3s ease; }
    .btn-main:hover i { transform: translateX(4px); }
    
    .contact-link {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #999;
      text-decoration: none; background: rgba(0, 0, 0, 0.4); padding: 7px 16px; border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(6px); transition: all 0.35s ease;
      margin-top: 6px; font-weight: 400;
    }
    .contact-link:hover { color: #fff; background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.3); }

    .footer-wrapper { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 10; }
    .footer-text { font-size: 0.72rem; font-weight: 500; letter-spacing: 3px; color: #666666; text-transform: uppercase; }

    .btn-admin-trigger {
      background: transparent; border: 1px solid rgba(255, 255, 255, 0.1); color: #555; font-size: 0.68rem;
      letter-spacing: 1.5px; padding: 4px 12px; border-radius: 20px; cursor: pointer; transition: all 0.3s ease;
    }
    .btn-admin-trigger:hover { color: #fff; border-color: rgba(255, 255, 255, 0.4); }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
    .modal-card { background: rgba(18, 18, 18, 0.95); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 30px; width: 100%; max-width: 380px; text-align: center; animation: smoothEntrance 0.4s ease; }
    .modal-title { font-family: 'Bebas Neue', cursive; font-size: 2rem; color: #ffffff; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 0.75rem; color: #888888; margin-bottom: 6px; }
    .input-field { width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #ffffff; outline: none; }
    .btn-login { width: 100%; padding: 12px; margin-top: 10px; background: #ffffff; color: #000000; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }

    .audio-player-box {
      position: fixed; bottom: 24px; right: 24px; z-index: 100; display: flex; align-items: center; gap: 12px;
      padding: 10px 18px; background: rgba(15, 15, 20, 0.65); border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 40px; backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .player-info { display: flex; flex-direction: column; max-width: 140px; }
    .player-title { font-size: 0.82rem; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
    .player-status-wrapper { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background-color: #666; }
    .status-dot.active { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .player-status { font-size: 0.62rem; color: #888; font-weight: 500; }
    .volume-box { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 20px; }
    .volume-slider { -webkit-appearance: none; appearance: none; width: 55px; height: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; cursor: pointer; }
    .player-toggle-btn { background: #ffffff; border: none; color: #000; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2); }

    @media (max-width: 900px) {
      .top-nav { left: 20px; right: 20px; top: 16px; width: calc(100% - 40px); }
      .nav-menu { display: none; }
      .content-layout { flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 30px; margin-top: 0; padding-left: 0; padding-right: 0; }
      .left-section { align-items: center; text-align: center; padding-right: 0; }
      .header-text { align-items: center; text-align: center; }
      .stats-row { justify-content: center; }
      .stat-item { align-items: center; }
      .right-section { align-items: center; width: 100%; }
      .btn-group { width: 100%; max-width: 260px; }
    }
  </style>
</head>
<body>

  <div id="bg-layer"></div>
  <div class="overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <header class="top-nav">
    <a href="#" class="nav-brand">
      <i class="fa-solid fa-crown"></i> <span>RYOSIG 680</span>
    </a>
    <nav class="nav-menu">
      <a href="index.html" class="nav-link active">HOME</a>
      <a href="gang.html" class="nav-link">GANG</a>
      <a href="family.html" class="nav-link">FAMILY</a>
    </nav>
    <div class="nav-status">
      <div class="nav-status-dot"></div>
      <span>ONLINE</span>
    </div>
  </header>

  <div class="container">
    <div class="content-layout">
      
      <div class="left-section">
        <div class="header-text">
          <p class="title-small" id="txt-small"></p>
          <h1 class="title-large" id="txt-large"></h1>
        </div>

        <div class="stats-row" id="stats-row-box">
          <div class="stat-item" id="stat-1" style="display: none;">
            <span class="stat-value" id="val-1"></span>
            <span class="stat-label" id="lbl-1"></span>
          </div>
          <div class="stat-item" id="stat-2" style="display: none;">
            <span class="stat-value" id="val-2"></span>
            <span class="stat-label" id="lbl-2"></span>
          </div>
          <div class="stat-item" id="stat-3" style="display: none;">
            <span class="stat-value" id="val-3"></span>
            <span class="stat-label" id="lbl-3"></span>
          </div>
        </div>
      </div>

      <div class="right-section">
        <span class="enter-label">ENTER THE GANG</span>
        <div class="btn-group">
          <a href="gang.html" class="btn-main">MEMBER GANG <i class="fa-solid fa-arrow-right"></i></a>
          <a href="family.html" class="btn-main">MEMBER FAMILY <i class="fa-solid fa-arrow-right"></i></a>
        </div>
        <a href="https://qaqenqcstudio.vercel.app/" target="_blank" class="contact-link">
          <i class="fa-regular fa-comment-dots"></i> ติดต่อทำเว็บ
        </a>
      </div>

    </div>

    <div class="footer-wrapper">
      <div class="footer-text">SYSTEM DESIGN BY QA QEN</div>
      <button class="btn-admin-trigger" onclick="openAdminModal()"><i class="fa-solid fa-lock"></i> Admin Panel</button>
    </div>
  </div>

  <div id="admin-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 class="modal-title">ADMIN ACCESS</h3>
      <div class="input-group"><label>EMAIL ADDRESS</label><input type="email" id="admin-email" class="input-field"></div>
      <div class="input-group"><label>PASSWORD</label><input type="password" id="admin-password" class="input-field"></div>
      <button class="btn-login" onclick="handleAdminLogin()">LOG IN</button>
      <button style="background:transparent; border:none; color:#666; margin-top:15px; cursor:pointer;" onclick="closeAdminModal()">CANCEL</button>
    </div>
  </div>

  <audio id="bg-audio" loop preload="auto"><source id="audio-source" src="" type="audio/mpeg"></audio>

  <div class="audio-player-box">
    <div class="player-info">
      <a id="player-music-link" href="#" target="_blank" class="player-title">กำลังโหลด...</a>
      <div class="player-status-wrapper">
        <span id="status-dot" class="status-dot"></span>
        <span id="player-status-text" class="player-status">STOPPED</span>
      </div>
    </div>
    <div class="volume-box">
      <i id="volume-icon" class="fa-solid fa-volume-high" style="font-size:0.75rem; color:#aaa;"></i>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.2">
    </div>
    <button id="player-btn" class="player-toggle-btn"><i id="player-icon" class="fa-solid fa-play"></i></button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const MUSIC_CONFIG = {
      songTitle: "HAIL TO THE KING",
      originalUrl: "https://youtu.be/aiigklosh-w?si=SrebT61qHH8B3WsD",
      musicFile: "music.mp3"
    };

    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : canvas.height + 10;
        this.radius = Math.random() * 1.8 + 0.5;
        this.speedY = Math.random() * 0.6 + 0.3;
        this.opacity = Math.random() * 0.7 + 0.2;
      }
      update() { this.y -= this.speedY; if (this.y < -10) this.reset(false); }
      draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.fill();
      }
    }
    for (let i = 0; i < 50; i++) particles.push(new Particle());
    function animateParticles() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }
    animateParticles();

    const firebaseConfig = {
      apiKey: "AIzaSyAHPEF07_zyE7hwZRPIBbwV_ewTz-xzdRo",
      authDomain: "sixtyeight-68.firebaseapp.com",
      projectId: "sixtyeight-68",
      storageBucket: "sixtyeight-68.firebasestorage.app",
      messagingSenderId: "736729322969",
      appId: "1:736729322969:web:cfa26d6e4be992ffd7f5c8"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("settings").doc("index_page").get().then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        
        // Header Texts
        const titleLarge = data.titleLarge || '';
        const titleSmall = data.titleSmall || '';
        
        const elLarge = document.getElementById('txt-large');
        const elSmall = document.getElementById('txt-small');

        if (titleLarge) { elLarge.innerText = titleLarge; elLarge.style.display = 'block'; }
        else { elLarge.style.display = 'none'; }

        if (titleSmall) { elSmall.innerText = titleSmall; elSmall.style.display = 'block'; }
        else { elSmall.style.display = 'none'; }

        // Stats Items (หากไม่มีการกรอกข้อมูลในช่องนั้นๆ จะซ่อนอัตโนมัติ)
        let hasStats = false;
        const statsRow = document.getElementById('stats-row-box');

        for (let i = 1; i <= 3; i++) {
          const val = data[`stat${i}Val`] || '';
          const lbl = data[`stat${i}Lbl`] || '';
          const itemBox = document.getElementById(`stat-${i}`);

          if (val || lbl) {
            document.getElementById(`val-${i}`).innerText = val;
            document.getElementById(`lbl-${i}`).innerText = lbl;
            itemBox.style.display = 'flex';
            hasStats = true;
          } else {
            itemBox.style.display = 'none';
          }
        }
        statsRow.style.display = hasStats ? 'flex' : 'none';

        // Background & Favicon
        if (data.bgUrl) {
          document.getElementById('bg-layer').style.backgroundImage = `url('${data.bgUrl}')`;
        }
        if (data.siteIcon) {
          document.getElementById('site-favicon').href = data.siteIcon;
        }
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const audio = document.getElementById("bg-audio");
      const audioSource = document.getElementById("audio-source");
      const playerTitle = document.getElementById("player-music-link");
      const playerStatus = document.getElementById("player-status-text");
      const statusDot = document.getElementById("status-dot");
      const playerBtn = document.getElementById("player-btn");
      const playerIcon = document.getElementById("player-icon");
      const volumeSlider = document.getElementById("volume-slider");

      audioSource.src = MUSIC_CONFIG.musicFile;
      audio.load();
      playerTitle.innerText = MUSIC_CONFIG.songTitle;
      playerTitle.href = MUSIC_CONFIG.originalUrl;

      audio.volume = 0.2;
      volumeSlider.value = 0.2;
      localStorage.setItem("music_volume", "0.2");

      const savedTime = localStorage.getItem("music_time");
      if (savedTime !== null) { audio.currentTime = parseFloat(savedTime); }

      audio.addEventListener("timeupdate", () => {
        localStorage.setItem("music_time", audio.currentTime);
      });

      function playMusic() {
        audio.play().then(() => {
          playerIcon.className = "fa-solid fa-pause";
          playerStatus.innerText = "PLAYING";
          statusDot.classList.add("active");
          localStorage.setItem("music_player_state", "playing");
          sessionStorage.setItem("music_user_stopped", "false");
        }).catch(() => {});
      }

      function pauseMusic() {
        audio.pause();
        playerIcon.className = "fa-solid fa-play";
        playerStatus.innerText = "STOPPED";
        statusDot.classList.remove("active");
        localStorage.setItem("music_player_state", "stopped");
        sessionStorage.setItem("music_user_stopped", "true");
      }

      const isStoppedByUser = sessionStorage.getItem("music_user_stopped") === "true";
      if (!isStoppedByUser) {
        playMusic();
        const startOnInteraction = (e) => {
          if (e.target.closest('#player-btn') || e.target.closest('#volume-slider') || e.target.closest('#admin-modal')) return;
          if (audio.paused && sessionStorage.getItem("music_user_stopped") !== "true") {
            playMusic();
          }
          document.removeEventListener("click", startOnInteraction);
        };
        document.addEventListener("click", startOnInteraction);
      } else {
        pauseMusic();
      }

      playerBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (audio.paused) { playMusic(); } else { pauseMusic(); }
      });

      volumeSlider.addEventListener("input", (e) => {
        audio.volume = parseFloat(e.target.value);
        localStorage.setItem("music_value", e.target.value);
      });
    });

    function openAdminModal() { document.getElementById('admin-modal').style.display = 'flex'; }
    function closeAdminModal() { document.getElementById('admin-modal').style.display = 'none'; }
    function handleAdminLogin() {
      const email = document.getElementById('admin-email').value;
      const pass = document.getElementById('admin-password').value;
      firebase.auth().signInWithEmailAndPassword(email, pass)
        .then(() => { window.location.href = "admin.html"; })
        .catch(err => alert("เข้าสู่ระบบไม่สำเร็จ: " + err.message));
    }
  </script>
</body>
</html>
