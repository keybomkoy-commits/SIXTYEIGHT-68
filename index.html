<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VISERIOM x 68</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #bg-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #000000;
      z-index: 1;
      filter: brightness(0.35) contrast(1.1);
      transition: background-image 0.5s ease-in-out;
      animation: bgFadeIn 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes bgFadeIn {
      0% { opacity: 0; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    .overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.92) 100%);
      z-index: 2;
    }

    #particles-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      text-align: center;
    }

    .main-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 3vh, 32px);
      width: 100%;
      max-width: 850px;
    }

    @keyframes smoothAppear {
      0% { opacity: 0; transform: translateY(25px) scale(0.96); filter: blur(8px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .header-text {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      animation: smoothAppear 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
      opacity: 0;
    }

    .title-large {
      font-family: 'Bebas Neue', cursive, sans-serif;
      font-size: clamp(3.8rem, 8.5vw, 6.8rem);
      letter-spacing: clamp(6px, 1.8vw, 16px);
      line-height: 0.95;
      text-transform: uppercase;
      font-weight: 400;
      background: linear-gradient(110deg, #888 0%, #fff 25%, #fff 50%, #888 75%, #fff 100%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: textShimmer 6s linear infinite, textPulse 3s ease-in-out infinite alternate;
    }

    @keyframes textShimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    @keyframes textPulse {
      0% { filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2)); }
      100% { filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.6)); }
    }

    .title-small {
      font-size: clamp(0.85rem, 1.5vw, 1.15rem);
      font-weight: 400;
      color: #888888;
      letter-spacing: clamp(6px, 1.2vw, 10px);
      text-transform: uppercase;
      opacity: 0.8;
    }

    .logo-box {
      width: clamp(320px, 48vw, 560px);
      height: clamp(160px, 24vw, 260px);
      background: rgba(18, 18, 18, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      transition: all 0.3s ease;
      animation: smoothAppear 1s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
      opacity: 0;
    }

    .logo-box:hover {
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 40px rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .logo-img {
      max-width: 85%;
      max-height: 85%;
      object-fit: contain;
      filter: drop-shadow(0 0 16px rgba(0, 0, 0, 0.9));
    }

    .logo-icon {
      font-size: clamp(4rem, 8vw, 6.5rem);
      color: #ffffff;
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.4));
    }

    .btn-group {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 580px;
      justify-content: center;
      animation: smoothAppear 1s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
      opacity: 0;
    }

    .btn-main {
      flex: 1;
      padding: clamp(14px, 2vh, 18px) 24px;
      font-size: clamp(0.95rem, 1.6vw, 1.1rem);
      font-weight: 600;
      letter-spacing: 2px;
      color: #ffffff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .btn-main span.sub-text {
      font-size: clamp(0.65rem, 1vw, 0.75rem);
      color: #666666;
      letter-spacing: 1.5px;
    }

    .btn-main:hover {
      background: rgba(255, 255, 255, 0.95);
      color: #000000;
      border-color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
    }

    .btn-main:hover span.sub-text { color: #333333; }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(0.75rem, 1.2vw, 0.85rem);
      color: #999999;
      text-decoration: none;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 20px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s ease;
      backdrop-filter: blur(6px);
      animation: smoothAppear 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
      opacity: 0;
    }

    .contact-link:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.1);
    }

    .footer-wrapper {
      position: absolute;
      bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      animation: smoothAppear 1s cubic-bezier(0.16, 1, 0.3, 1) 1s forwards;
      opacity: 0;
    }

    .footer-text {
      font-size: clamp(0.7rem, 1.1vw, 0.8rem);
      font-weight: 500;
      letter-spacing: 3px;
      color: #555555;
      text-transform: uppercase;
    }

    .btn-admin-trigger {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #444444;
      font-size: 0.68rem;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-transform: uppercase;
    }

    .btn-admin-trigger:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-card {
      background: rgba(18, 18, 18, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      text-align: center;
      position: relative;
      animation: modalFadeIn 0.3s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 2rem;
      letter-spacing: 2px;
      color: #ffffff;
      margin-bottom: 20px;
    }

    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 0.75rem; color: #888888; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }

    .input-field {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-field:focus { border-color: #ffffff; box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }

    .btn-login {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-login:hover { background: #cccccc; transform: translateY(-2px); }
    .btn-close-modal { background: transparent; border: none; color: #666666; font-size: 0.8rem; margin-top: 12px; cursor: pointer; transition: color 0.2s; }
    .btn-close-modal:hover { color: #ffffff; }

    .audio-player-box {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px 8px 8px;
      background: rgba(18, 18, 18, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      animation: smoothAppear 1s cubic-bezier(0.16, 1, 0.3, 1) 0.9s forwards;
      opacity: 0;
    }

    .player-cover-wrapper {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .player-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      animation: spinCover 10s linear infinite;
      animation-play-state: paused;
    }

    .player-cover-img.playing { animation-play-state: running; }

    @keyframes spinCover { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .player-info { display: flex; flex-direction: column; justify-content: center; max-width: 130px; text-align: left; }
    .player-title { font-size: 0.82rem; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
    .player-status { font-size: 0.65rem; color: #888888; letter-spacing: 1px; text-transform: uppercase; }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .volume-icon { font-size: 0.75rem; color: #aaaaaa; width: 12px; text-align: center; }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 55px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.25);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
    }

    .player-toggle-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .player-toggle-btn:hover { background: #ffffff; color: #000000; transform: scale(1.08); }

    @media (max-width: 580px) {
      .btn-group { flex-direction: column; width: 100%; max-width: 320px; }
      .logo-box { width: 100%; }
      .audio-player-box { bottom: 16px; right: 16px; padding: 6px 12px 6px 6px; }
      .player-info { max-width: 90px; }
      .volume-slider { width: 40px; }
    }
  </style>
</head>
<body>

  <div id="bg-layer"></div>

  <audio id="bg-audio" loop preload="auto">
    <source id="audio-source" src="" type="audio/mpeg">

  <div class="audio-player-box">
    <div class="player-cover-wrapper">
      <img id="player-cover" src="cover.png" alt="Music Cover" class="player-cover-img">
    </div>
    <div class="player-info">
      <a id="player-music-link" href="#" target="_blank" class="player-title">กำลังโหลด...</a>
      <span id="player-status-text" class="player-status">STOPPED</span>
    </div>

    <div class="volume-box">
      <i id="volume-icon" class="fa-solid fa-volume-high volume-icon"></i>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
    </div>

    <button id="player-btn" class="player-toggle-btn" aria-label="Toggle Music">
      <i id="player-icon" class="fa-solid fa-play"></i>
    </button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const MUSIC_CONFIG = {
      songTitle: "NASTY BABE - ПАТРИКИ (Lyric video, 2025)",
      originalUrl: "https://youtu.be/aiigklosh-w?si=SrebT61qHH8B3WsD",
      musicFile: "music.mp3",
      coverImage: "cover.png"
    };

    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const particleCount = 80;

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : canvas.height + 10;
        this.radius = Math.random() * 1.8 + 0.5;
        this.speedY = Math.random() * 0.6 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.7 + 0.2;
      }
      update() { this.y -= this.speedY; this.x += this.speedX; if (this.y < -10) this.reset(false); }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
        ctx.fill();
        ctx.closePath();
      }
    }

    for (let i = 0; i < particleCount; i++) particles.push(new Particle());
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    document.addEventListener("DOMContentLoaded", () => {
      const audio = document.getElementById("bg-audio");
      const audioSource = document.getElementById("audio-source");
      const playerCover = document.getElementById("player-cover");
      const playerTitle = document.getElementById("player-music-link");
      const playerStatus = document.getElementById("player-status-text");
      const playerBtn = document.getElementById("player-btn");
      const playerIcon = document.getElementById("player-icon");
      const volumeSlider = document.getElementById("volume-slider");
      const volumeIcon = document.getElementById("volume-icon");

      audioSource.src = MUSIC_CONFIG.musicFile;
      audio.load();
      playerCover.src = MUSIC_CONFIG.coverImage;
      playerTitle.innerText = MUSIC_CONFIG.songTitle;
      playerTitle.href = MUSIC_CONFIG.originalUrl;

      const savedVolume = localStorage.getItem("music_volume");
      if (savedVolume !== null) { audio.volume = parseFloat(savedVolume); volumeSlider.value = savedVolume; }
      else { audio.volume = 0.5; volumeSlider.value = 0.5; }
      updateVolumeIcon(audio.volume);

      const savedTime = localStorage.getItem("music_current_time");
      if (savedTime !== null) { audio.currentTime = parseFloat(savedTime); }

      setInterval(() => {
        if (!audio.paused) localStorage.setItem("music_current_time", audio.currentTime);
      }, 500);

      function playMusic() {
        audio.play().then(() => {
          playerIcon.className = "fa-solid fa-pause";
          playerStatus.innerText = "PLAYING";
          playerStatus.style.color = "#ffffff";
          playerCover.classList.add("playing");
          localStorage.setItem("music_player_state", "playing");
        }).catch(err => console.log("Waiting for click"));
      }

      function pauseMusic() {
        audio.pause();
        playerIcon.className = "fa-solid fa-play";
        playerStatus.innerText = "STOPPED";
        playerStatus.style.color = "#888888";
        playerCover.classList.remove("playing");
        localStorage.setItem("music_player_state", "stopped");
      }

      function updateVolumeIcon(vol) {
        if (vol === 0) volumeIcon.className = "fa-solid fa-volume-xmark volume-icon";
        else if (vol < 0.5) volumeIcon.className = "fa-solid fa-volume-low volume-icon";
        else volumeIcon.className = "fa-solid fa-volume-high volume-icon";
      }

      const handleGlobalClick = (e) => {
        if (!e.target.closest(".audio-player-box") && !e.target.closest("#admin-modal")) {
          if (localStorage.getItem("music_player_state") !== "stopped" && audio.paused) {
            playMusic();
          }
        }
      };
      document.addEventListener("click", handleGlobalClick);

      if (localStorage.getItem("music_player_state") !== "stopped") playMusic();
      else pauseMusic();

      playerBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (audio.paused) playMusic();
        else pauseMusic();
      });

      volumeSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        audio.volume = val;
        updateVolumeIcon(val);
        localStorage.setItem("music_volume", val);
      });
      volumeSlider.addEventListener("click", (e) => e.stopPropagation());
    });

    const firebaseConfig = {
      apiKey: "AIzaSyAHPEF07_zyE7hwZRPIBbwV_ewTz-xzdRo",
      authDomain: "sixtyeight-68.firebaseapp.com",
      projectId: "sixtyeight-68",
      storageBucket: "sixtyeight-68.firebasestorage.app",
      messagingSenderId: "736729322969",
      appId: "1:736729322969:web:cfa26d6e4be992ffd7f5c8"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    db.collection("settings").doc("index_page").onSnapshot((doc) => {
      if (doc.exists) {
        const data = doc.data();
        if (data.titleLarge) document.getElementById('txt-large').innerText = data.titleLarge;
        if (data.titleSmall) document.getElementById('txt-small').innerText = data.titleSmall;

        const logoImg = document.getElementById('img-logo');
        const logoIcon = document.getElementById('icon-logo');

        if (data.logoUrl && data.logoUrl.trim() !== "") {
          logoImg.src = data.logoUrl;
          logoImg.style.display = 'block';
          logoIcon.style.display = 'none';
        } else if (data.logoIcon && data.logoIcon.trim() !== "") {
          logoIcon.className = `logo-icon ${data.logoIcon}`;
          logoIcon.style.display = 'block';
          logoImg.style.display = 'none';
        }

        const bgLayer = document.getElementById('bg-layer');
        if (data.bgUrl && data.bgUrl.trim() !== "") {
          bgLayer.style.backgroundImage = `url('${data.bgUrl}')`;
        }
      }
    });

    function openAdminModal() { document.getElementById('admin-modal').style.display = 'flex'; }
    function closeAdminModal() {
      document.getElementById('admin-modal').style.display = 'none';
      document.getElementById('admin-email').value = '';
      document.getElementById('admin-password').value = '';
    }

    function handleAdminLogin() {
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value.trim();

      if (!email || !password) {
        alert("กรุณากรอก Email และ Password ให้ครบถ้วน");
        return;
      }

      auth.signInWithEmailAndPassword(email, password)
        .then(() => { window.location.href = "admin.html"; })
        .catch((error) => { alert("เข้าสู่ระบบไม่สำเร็จ: " + error.message); });
    }
  </script>
</body>
</html>
