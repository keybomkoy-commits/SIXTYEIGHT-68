<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RYOSIG 680</title>
  <link id="site-favicon" rel="icon" href="">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; min-height: 100vh; overflow-x: hidden; background-color: #000000; color: #ffffff; }
    body { display: flex; justify-content: center; align-items: center; position: relative; }

    @keyframes smoothEntrance {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #bg-layer {
      position: absolute; inset: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #000000;
      z-index: 1; filter: brightness(0.20) contrast(1.1); transition: background-image 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .overlay { position: absolute; inset: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.95) 100%); z-index: 2; }
    #particles-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

    .top-nav {
      position: absolute; top: 28px; left: 40px; right: 40px; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      max-width: 1400px; margin: 0 auto; width: calc(100% - 80px);
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px; font-family: 'Bebas Neue', cursive;
      font-size: 1.25rem; letter-spacing: 2px; color: #ffffff; text-decoration: none;
      background: rgba(18, 18, 18, 0.4); padding: 8px 18px; border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px);
    }
    .nav-brand i { color: #d4af37; }
    
    .nav-menu { display: flex; align-items: center; gap: 32px; }
    .nav-link {
      font-size: 0.8rem; font-weight: 500; letter-spacing: 2px; color: #777777; text-decoration: none;
      transition: color 0.3s ease; text-transform: uppercase;
    }
    .nav-link:hover, .nav-link.active { color: #ffffff; }

    .nav-status {
      display: flex; align-items: center; gap: 8px; font-size: 0.75rem; letter-spacing: 1px;
      background: rgba(18, 18, 18, 0.4); padding: 8px 16px; border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); color: #bbb;
    }
    .nav-status-dot { width: 6px; height: 6px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }

    .container { 
      position: relative; z-index: 3; width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 4%; text-align: center; 
      animation: smoothEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .content-layout {
      width: 100%; max-width: 1400px; display: flex; justify-content: space-between; align-items: center; position: relative; margin-top: 20px;
      padding-left: 0; padding-right: 24px;
    }

    .left-section {
      display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 20px; z-index: 4;
      flex: 1; padding-right: 40px; margin-top: -50px;
    }

    .header-text { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; width: 100%; }

    .brand-logo-container {
      display: none; 
      position: relative;
      width: 100%;
      max-width: 440px; 
      padding: 22px;
    }

    .brand-logo-container::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,0.1) 0%, rgba(255,170,0,0.4) 50%, rgba(255,170,0,1) 85%, rgba(255,255,255,1) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: ultraSmoothOrbit 5s linear infinite;
      box-shadow: 0 0 25px rgba(255, 170, 0, 0.4);
    }

    @keyframes ultraSmoothOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .brand-logo-container img {
      width: 100%;
      height: auto;
      object-fit: contain;
      border-radius: 50%;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 20px rgba(255, 170, 0, 0.25));
    }
    
    .title-large {
      font-family: 'Bebas Neue', cursive; 
      font-size: clamp(3rem, 7vw, 5.5rem); 
      letter-spacing: clamp(4px, 1.2vw, 14px);
      line-height: 0.95; 
      text-transform: uppercase;
      width: 100%;
      overflow: visible;
      background: linear-gradient(110deg, #888 0%, #fff 25%, #fff 50%, #888 75%, #fff 100%);
      background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text;
      animation: textShimmer 6s linear infinite;
    }

    @keyframes textShimmer { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }

    .right-section {
      display: flex; flex-direction: column; align-items: flex-end; gap: 12px; z-index: 4;
      flex-shrink: 0;
    }

    .btn-group { display: flex; flex-direction: column; gap: 14px; width: 310px; }
    
    .btn-main {
      width: 100%; padding: 18px 24px; font-size: 1.15rem; font-weight: 500;
      letter-spacing: 2.5px; color: #ffffff; text-decoration: none; background: rgba(18, 18, 18, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; backdrop-filter: blur(12px);
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1); display: flex; justify-content: space-between; align-items: center;
      position: relative; overflow: hidden;
    }

    .btn-main span, .btn-main i {
      position: relative;
      z-index: 2;
    }

    .btn-main::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 50%; height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      animation: innerSweep 5s infinite linear;
      z-index: 1;
    }

    @keyframes innerSweep {
      0% { left: -100%; }
      20% { left: 200%; }
      100% { left: 200%; }
    }

    .btn-main:hover { 
      background: rgba(255, 255, 255, 0.95); 
      color: #000000; 
      border-color: #ffffff; 
      transform: translateX(-4px); 
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.25); 
    }
    .btn-main:hover::before { display: none; }
    .btn-main:active { transform: translateX(-1px) scale(0.98); }
    .btn-main i { font-size: 0.9rem; transition: transform 0.3s ease; }
    .btn-main:hover i { transform: translateX(4px); }
    
    /* ปุ่มติดต่อทำเว็บแบบมินิมอล กลมกลืน ไม่เด่นเกินไป */
    .contact-link {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.75rem; color: #888888;
      text-decoration: none; background: rgba(0, 0, 0, 0.3); padding: 6px 14px; border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(6px); transition: all 0.35s ease;
      font-weight: 400;
    }
    .contact-link:hover { color: #ffffff; background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }

    /* จัดระเบียบ Footer และ Partner สมดุล ไม่ทับซ้อน */
    .footer-wrapper { 
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); 
      display: flex; flex-direction: column; align-items: center; gap: 8px; 
      z-index: 10; width: 100%; max-width: 900px; padding: 0 20px;
    }
    
    .partner-section {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-bottom: 2px;
    }
    
    .partner-label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 3px;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .partner-wrapper {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
      width: 100%;
    }
    
    .partner-btn {
      padding: 4px 12px; 
      font-size: 0.72rem; 
      font-weight: 400; 
      letter-spacing: 1.5px; 
      color: #999; 
      text-decoration: none; 
      background: rgba(18, 18, 18, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08); 
      border-radius: 15px; 
      backdrop-filter: blur(10px);
      transition: all 0.3s ease; 
      display: inline-flex; 
      align-items: center; 
      gap: 6px;
    }
    .partner-btn:hover { 
      background: rgba(255, 255, 255, 0.1); 
      border-color: rgba(255, 255, 255, 0.2); 
      color: #fff; 
      cursor: pointer; 
    }
    .partner-btn i { font-size: 0.65rem; }
    .partner-btn:not([href]) { cursor: default; }

    .footer-bottom-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      width: 100%;
      flex-wrap: wrap;
    }

    .footer-text { font-size: 0.62rem; font-weight: 400; letter-spacing: 2px; color: #444444; text-transform: uppercase; }

    .audio-player-box {
      position: fixed; bottom: 24px; right: 24px; z-index: 100; display: flex; align-items: center; gap: 12px;
      padding: 10px 18px; background: rgba(15, 15, 20, 0.65); border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 40px; backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .player-info { display: flex; flex-direction: column; max-width: 140px; }
    .player-title { font-size: 0.82rem; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
    .player-status-wrapper { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background-color: #666; }
    .status-dot.active { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .player-status { font-size: 0.62rem; color: #888; font-weight: 500; }
    .volume-box { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 20px; }
    .volume-slider { -webkit-appearance: none; appearance: none; width: 55px; height: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; outline: none; cursor: pointer; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #fff; cursor: pointer; }
    .player-toggle-btn { background: #ffffff; border: none; color: #000; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2); }

    @media (max-width: 900px) {
      .top-nav { left: 20px; right: 20px; top: 16px; width: calc(100% - 40px); }
      .nav-menu { display: none; }
      .content-layout { flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 24px; margin-top: 0; padding-left: 0; padding-right: 0; }
      .left-section { align-items: center; text-align: center; padding-right: 0; width: 100%; margin-top: 0; }
      .header-text { align-items: center; text-align: center; }
      .brand-logo-container { max-width: 320px; margin-left: 0; }
      .right-section { align-items: center; width: 100%; }
      .btn-group { width: 100%; max-width: 280px; }
      
      .footer-wrapper { position: relative; bottom: auto; left: auto; transform: none; margin-top: 25px; }
      html, body { overflow-y: auto; }
      .container { height: auto; min-height: 100vh; justify-content: space-between; padding-top: 80px; padding-bottom: 80px; }
    }
  </style>
</head>
<body>

  <div id="bg-layer"></div>
  <div class="overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <header class="top-nav">
    <a href="#" class="nav-brand">
      <i class="fa-solid fa-crown"></i> <span>RYOSIG 680</span>
    </a>
    <nav class="nav-menu">
      <a href="index.html" class="nav-link active">HOME</a>
      <a href="family.html" class="nav-link">FAMILY</a>
    </nav>
    <div class="nav-status">
      <div class="nav-status-dot"></div>
      <span>ONLINE</span>
    </div>
  </header>

  <div class="container">
    <div class="content-layout">
      
      <div class="left-section">
        <div class="header-text">
          <div id="brand-logo" class="brand-logo-container">
            <img id="img-logo" src="" alt="Brand Logo">
          </div>
          <h1 class="title-large" id="txt-large">RYOSIG 680</h1>
        </div>
      </div>

      <div class="right-section">
        <div class="btn-group">
          <a href="family.html" class="btn-main"><span>MEMBER FAMILY</span> <i class="fa-solid fa-arrow-right"></i></a>
        </div>
      </div>

    </div>

    <div class="footer-wrapper">
      <div id="partner-section" class="partner-section">
        <div class="partner-label">PARTNER BY</div>
        <div id="partner-buttons-container" class="partner-wrapper"></div>
      </div>
      
      <div class="footer-bottom-row">
        <a href="https://qaqenqcstudio.vercel.app/" target="_blank" class="contact-link">
          <i class="fa-regular fa-comment-dots"></i> ติดต่อทำเว็บ
        </a>
        <div class="footer-text">SYSTEM DESIGN BY QA QEN</div>
      </div>
    </div>
  </div>

  <audio id="bg-audio" loop preload="auto"><source id="audio-source" src="" type="audio/mpeg"></audio>

  <div class="audio-player-box">
    <div class="player-info">
      <a id="player-music-link" href="#" target="_blank" class="player-title">กำลังโหลด...</a>
      <div class="player-status-wrapper">
        <span id="status-dot" class="status-dot"></span>
        <span id="player-status-text" class="player-status">STOPPED</span>
      </div>
    </div>
    <div class="volume-box">
      <i id="volume-icon" class="fa-solid fa-volume-high" style="font-size:0.75rem; color:#aaa;"></i>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.2">
    </div>
    <button id="player-btn" class="player-toggle-btn"><i id="player-icon" class="fa-solid fa-play"></i></button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const MUSIC_CONFIG = {
      songTitle: "HAIL TO THE KING",
      originalUrl: "https://youtu.be/aiigklosh-w?si=SrebT61qHH8B3WsD",
      musicFile: "music.mp3"
    };

    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let sparks = [];

    function resizeCanvas() { 
      canvas.width = window.innerWidth; 
      canvas.height = window.innerHeight; 
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Spark {
      constructor() {
        this.reset(true);
      }
      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : canvas.height + 20;
        this.size = Math.random() * 2.5 + 0.8;
        this.speedY = Math.random() * 2 + 1;
        this.speedX = (Math.random() - 0.5) * 3;
        this.angle = Math.random() * Math.PI * 2;
        this.spin = (Math.random() - 0.5) * 0.05;
        this.opacity = Math.random() * 0.8 + 0.2;
        this.color = Math.random() > 0.4 ? '#ffaa00' : (Math.random() > 0.5 ? '#ff3300' : '#ffffff');
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX + Math.sin(this.angle) * 1.5;
        this.angle += this.spin;
        this.opacity -= 0.003;

        if (this.y < -10 || this.opacity <= 0) {
          this.reset(false);
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(this.opacity, 0);
        ctx.shadowBlur = 8;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 80; i++) {
      sparks.push(new Spark());
    }

    function animateSparks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      sparks.forEach(s => {
        s.update();
        s.draw();
      });
      requestAnimationFrame(animateSparks);
    }
    animateSparks();

    const firebaseConfig = {
      apiKey: "AIzaSyAHPEF07_zyE7hwZRPIBbwV_ewTz-xzdRo",
      authDomain: "sixtyeight-68.firebaseapp.com",
      projectId: "sixtyeight-68",
      storageBucket: "sixtyeight-68.firebasestorage.app",
      messagingSenderId: "736729322969",
      appId: "1:736729322969:web:cfa26d6e4be992ffd7f5c8"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("settings").doc("index_page").get().then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        
        const titleLarge = data.titleLarge || 'RYOSIG 680';
        const elLarge = document.getElementById('txt-large');
        if (titleLarge) { elLarge.innerText = titleLarge; }

        const logoUrl = data.logoUrl || '';
        const elLogoBox = document.getElementById('brand-logo');
        const elLogoImg = document.getElementById('img-logo');
        
        if (logoUrl) {
          elLogoImg.src = logoUrl;
          elLogoBox.style.display = 'block';
        } else {
          elLogoBox.style.display = 'none';
        }

        if (data.bgUrl) {
          document.getElementById('bg-layer').style.backgroundImage = `url('${data.bgUrl}')`;
        }
        if (data.siteIcon) {
          document.getElementById('site-favicon').href = data.siteIcon;
        }
      }
    });

    db.collection("partners").orderBy("createdAt", "asc").onSnapshot((snapshot) => {
      const container = document.getElementById('partner-buttons-container');
      const section = document.getElementById('partner-section');
      container.innerHTML = '';

      if (snapshot.empty) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'flex';
      
      snapshot.forEach(doc => {
        const p = doc.data();
        const btn = document.createElement('a');
        btn.className = 'partner-btn';
        btn.innerHTML = `<i class="fa-solid fa-handshake"></i> <span>${p.name}</span>`;
        
        if (p.url) {
          btn.href = p.url;
          btn.target = "_blank";
        }
        container.appendChild(btn);
      });
    });

    document.addEventListener("DOMContentLoaded", () => {
      const audio = document.getElementById("bg-audio");
      const audioSource = document.getElementById("audio-source");
      const playerTitle = document.getElementById("player-music-link");
      const playerStatus = document.getElementById("player-status-text");
      const statusDot = document.getElementById("status-dot");
      const playerBtn = document.getElementById("player-btn");
      const playerIcon = document.getElementById("player-icon");
      const volumeSlider = document.getElementById("volume-slider");

      audioSource.src = MUSIC_CONFIG.musicFile;
      audio.load();
      playerTitle.innerText = MUSIC_CONFIG.songTitle;
      playerTitle.href = MUSIC_CONFIG.originalUrl;

      audio.volume = 0.2;
      volumeSlider.value = 0.2;
      localStorage.setItem("music_volume", "0.2");

      const savedTime = localStorage.getItem("music_time");
      if (savedTime !== null) { audio.currentTime = parseFloat(savedTime); }

      audio.addEventListener("timeupdate", () => {
        localStorage.setItem("music_time", audio.currentTime);
      });

      function playMusic() {
        audio.play().then(() => {
          playerIcon.className = "fa-solid fa-pause";
          playerStatus.innerText = "PLAYING";
          statusDot.classList.add("active");
          localStorage.setItem("music_player_state", "playing");
          sessionStorage.setItem("music_user_stopped", "false");
        }).catch(() => {});
      }

      function pauseMusic() {
        audio.pause();
        playerIcon.className = "fa-solid fa-play";
        playerStatus.innerText = "STOPPED";
        statusDot.classList.remove("active");
        localStorage.setItem("music_player_state", "stopped");
        sessionStorage.setItem("music_user_stopped", "true");
      }

      const isStoppedByUser = sessionStorage.getItem("music_user_stopped") === "true";
      if (!isStoppedByUser) {
        playMusic();
        const startOnInteraction = (e) => {
          if (e.target.closest('#player-btn') || e.target.closest('#volume-slider')) return;
          if (audio.paused && sessionStorage.getItem("music_user_stopped") !== "true") {
            playMusic();
          }
          document.removeEventListener("click", startOnInteraction);
        };
        document.addEventListener("click", startOnInteraction);
      } else {
        pauseMusic();
      }

      playerBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (audio.paused) { playMusic(); } else { pauseMusic(); }
      });

      volumeSlider.addEventListener("input", (e) => {
        audio.volume = parseFloat(e.target.value);
        localStorage.setItem("music_value", e.target.value);
      });
    });
  </script>
</body>
</html>
