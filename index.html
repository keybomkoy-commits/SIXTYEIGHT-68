<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OFFICIAL COMMUNITY</title>
  <link id="site-favicon" rel="icon" href="">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; min-height: 100vh; overflow: hidden; background-color: #000000; color: #ffffff; }
    body { display: flex; justify-content: center; align-items: center; position: relative; }

    /* Keyframes Smooth Entrance */
    @keyframes smoothEntrance {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    #bg-layer {
      position: absolute; inset: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #000000;
      z-index: 1; filter: brightness(0.35) contrast(1.1); transition: background-image 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .overlay { position: absolute; inset: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.92) 100%); z-index: 2; }
    #particles-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

    .container { 
      position: relative; z-index: 3; width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 24px; text-align: center; 
      animation: smoothEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .main-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(20px, 3vh, 32px); width: 100%; max-width: 850px; }

    .header-text { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .title-large {
      font-family: 'Bebas Neue', cursive; font-size: clamp(3.8rem, 8.5vw, 6.8rem); letter-spacing: clamp(6px, 1.8vw, 16px);
      line-height: 0.95; text-transform: uppercase;
      background: linear-gradient(110deg, #888 0%, #fff 25%, #fff 50%, #888 75%, #fff 100%);
      background-size: 200% auto; color: transparent; -webkit-background-clip: text; background-clip: text;
      animation: textShimmer 6s linear infinite;
    }

    @keyframes textShimmer { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }

    .title-small { font-size: clamp(0.85rem, 1.5vw, 1.15rem); color: #888888; letter-spacing: clamp(6px, 1.2vw, 10px); text-transform: uppercase; }

    .logo-box {
      width: clamp(320px, 48vw, 560px); height: clamp(160px, 24vw, 260px);
      background: rgba(18, 18, 18, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
      backdrop-filter: blur(14px); display: none; justify-content: center; align-items: center; padding: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7); transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .logo-box:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.05);
    }

    .logo-img { max-width: 85%; max-height: 85%; object-fit: contain; }
    .logo-icon { font-size: clamp(4rem, 8vw, 6.5rem); color: #ffffff; }

    .btn-group { display: flex; gap: 16px; width: 100%; max-width: 580px; justify-content: center; }
    .btn-main {
      flex: 1; padding: clamp(14px, 2vh, 18px) 24px; font-size: clamp(0.95rem, 1.6vw, 1.1rem); font-weight: 600;
      letter-spacing: 2px; color: #ffffff; text-decoration: none; background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; backdrop-filter: blur(10px);
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1); display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .btn-main:hover { background: #ffffff; color: #000000; transform: translateY(-4px); box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2); }
    .btn-main:active { transform: translateY(-1px) scale(0.98); }
    .btn-main span.sub-text { font-size: clamp(0.65rem, 1vw, 0.75rem); color: #666666; transition: color 0.3s ease; }
    .btn-main:hover span.sub-text { color: #333333; }

    .contact-link {
      display: inline-flex; align-items: center; gap: 8px; font-size: clamp(0.75rem, 1.2vw, 0.85rem); color: #999999;
      text-decoration: none; background: rgba(0, 0, 0, 0.6); padding: 8px 20px; border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.12); backdrop-filter: blur(6px); transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .contact-link:hover { color: #ffffff; background: rgba(255, 255, 255, 0.12); transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.25); }

    .footer-wrapper { position: absolute; bottom: 25px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .footer-text { font-size: clamp(0.7rem, 1.1vw, 0.8rem); font-weight: 500; letter-spacing: 3px; color: #555555; text-transform: uppercase; }

    .btn-admin-trigger {
      background: transparent; border: 1px solid rgba(255, 255, 255, 0.1); color: #444444; font-size: 0.68rem;
      letter-spacing: 1.5px; padding: 4px 12px; border-radius: 20px; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .btn-admin-trigger:hover { color: #ffffff; border-color: rgba(255, 255, 255, 0.4); transform: scale(1.05); }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); z-index: 9999; justify-content: center; align-items: center; padding: 20px; transition: all 0.3s ease; }
    .modal-card { background: rgba(18, 18, 18, 0.95); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 30px; width: 100%; max-width: 380px; text-align: center; animation: smoothEntrance 0.4s ease; }
    .modal-title { font-family: 'Bebas Neue', cursive; font-size: 2rem; color: #ffffff; margin-bottom: 20px; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 0.75rem; color: #888888; margin-bottom: 6px; }
    .input-field { width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; color: #ffffff; outline: none; transition: all 0.3s ease; }
    .input-field:focus { border-color: rgba(255, 255, 255, 0.5); box-shadow: 0 0 10px rgba(255, 255, 255, 0.1); }
    .btn-login { width: 100%; padding: 12px; margin-top: 10px; background: #ffffff; color: #000000; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
    .btn-login:hover { background: #dddddd; transform: translateY(-2px); }

    /* ==========================================
       LATEST FUTURISTIC AUDIO PLAYER GUI
       ========================================== */
    .audio-player-box {
      position: fixed; bottom: 24px; right: 24px; z-index: 100; display: flex; align-items: center; gap: 12px;
      padding: 10px 18px; background: rgba(15, 15, 20, 0.65); border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 40px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .audio-player-box:hover {
      background: rgba(20, 20, 28, 0.85);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 15px rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }
    .player-info { display: flex; flex-direction: column; max-width: 140px; }
    .player-title { font-size: 0.82rem; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; transition: color 0.3s ease; }
    .player-title:hover { color: #cccccc; }
    .player-status-wrapper { display: flex; align-items: center; gap: 6px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background-color: #666; transition: all 0.3s ease; }
    .status-dot.active { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .player-status { font-size: 0.62rem; color: #888888; font-weight: 500; letter-spacing: 0.5px; }
    .volume-box { display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.05); transition: background 0.3s ease; }
    .volume-box:hover { background: rgba(255, 255, 255, 0.1); }
    .volume-slider { -webkit-appearance: none; appearance: none; width: 55px; height: 3px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; outline: none; transition: all 0.3s ease; cursor: pointer; }
    .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #ffffff; cursor: pointer; transition: transform 0.2s ease; }
    .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.3); }
    .player-toggle-btn { background: #ffffff; border: none; color: #000000; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1); box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2); }
    .player-toggle-btn:hover { transform: scale(1.1); background: #eeeeee; box-shadow: 0 6px 18px rgba(255, 255, 255, 0.4); }
    .player-toggle-btn:active { transform: scale(0.92); }
  </style>
</head>
<body>

  <div id="bg-layer"></div>
  <div class="overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <div class="container">
    <div class="main-wrapper">
      <div class="header-text">
        <h1 class="title-large" id="txt-large">...</h1>
        <p class="title-small" id="txt-small">...</p>
      </div>

      <div class="logo-box" id="logo-box">
        <img id="img-logo" src="" alt="Logo" class="logo-img" style="display: none;">
        <i id="icon-logo" class="" style="display: none;"></i>
      </div>

      <div class="btn-group">
        <a href="gang.html" class="btn-main">MEMBER GANG<span class="sub-text">MEMBER ZONE</span></a>
        <a href="family.html" class="btn-main">MEMBER FAMILY<span class="sub-text">MEMBER ZONE</span></a>
      </div>

      <a href="https://qaqenqcstudio.vercel.app/" target="_blank" class="contact-link">
        <i class="fa-regular fa-comment-dots"></i> ติดต่อทำเว็บ
      </a>
    </div>

    <div class="footer-wrapper">
      <div class="footer-text">SYSTEM DESIGN BY QA QEN</div>
      <button class="btn-admin-trigger" onclick="openAdminModal()"><i class="fa-solid fa-lock"></i> Admin Panel</button>
    </div>
  </div>

  <div id="admin-modal" class="modal-overlay">
    <div class="modal-card">
      <h3 class="modal-title">ADMIN ACCESS</h3>
      <div class="input-group"><label>EMAIL ADDRESS</label><input type="email" id="admin-email" class="input-field"></div>
      <div class="input-group"><label>PASSWORD</label><input type="password" id="admin-password" class="input-field"></div>
      <button class="btn-login" onclick="handleAdminLogin()">LOG IN</button>
      <button style="background:transparent; border:none; color:#666; margin-top:10px; cursor:pointer;" onclick="closeAdminModal()">CANCEL</button>
    </div>
  </div>

  <audio id="bg-audio" loop preload="auto"><source id="audio-source" src="" type="audio/mpeg"></audio>

  <div class="audio-player-box">
    <div class="player-info">
      <a id="player-music-link" href="#" target="_blank" class="player-title">กำลังโหลด...</a>
      <div class="player-status-wrapper">
        <span id="status-dot" class="status-dot"></span>
        <span id="player-status-text" class="player-status">STOPPED</span>
      </div>
    </div>
    <div class="volume-box">
      <i id="volume-icon" class="fa-solid fa-volume-high" style="font-size:0.75rem; color:#aaa;"></i>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
    </div>
    <button id="player-btn" class="player-toggle-btn"><i id="player-icon" class="fa-solid fa-play"></i></button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const MUSIC_CONFIG = {
      songTitle: "NASTY BABE - ПАТРИКИ (Lyric video, 2025)",
      originalUrl: "https://youtu.be/aiigklosh-w?si=SrebT61qHH8B3WsD",
      musicFile: "music.mp3"
    };

    /* Particle effect */
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : canvas.height + 10;
        this.radius = Math.random() * 1.8 + 0.5;
        this.speedY = Math.random() * 0.6 + 0.3;
        this.opacity = Math.random() * 0.7 + 0.2;
      }
      update() { this.y -= this.speedY; if (this.y < -10) this.reset(false); }
      draw() {
        ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; ctx.fill();
      }
    }
    for (let i = 0; i < 50; i++) particles.push(new Particle());
    function animateParticles() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }
    animateParticles();

    /* Firebase Sync Fast Load */
    const firebaseConfig = {
      apiKey: "AIzaSyAHPEF07_zyE7hwZRPIBbwV_ewTz-xzdRo",
      authDomain: "sixtyeight-68.firebaseapp.com",
      projectId: "sixtyeight-68",
      storageBucket: "sixtyeight-68.firebasestorage.app",
      messagingSenderId: "736729322969",
      appId: "1:736729322969:web:cfa26d6e4be992ffd7f5c8"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("settings").doc("index_page").get().then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        document.getElementById('txt-large').innerText = data.titleLarge || 'SIXTYEIGHT 68';
        document.getElementById('txt-small').innerText = data.titleSmall || 'OFFICIAL COMMUNITY';
        
        if (data.bgUrl) {
          document.getElementById('bg-layer').style.backgroundImage = `url('${data.bgUrl}')`;
        }

        if (data.siteIcon) {
          document.getElementById('site-favicon').href = data.siteIcon;
        }

        const logoBox = document.getElementById('logo-box');
        const imgLogo = document.getElementById('img-logo');
        const iconLogo = document.getElementById('icon-logo');

        if (data.logoUrl) {
          imgLogo.src = data.logoUrl;
          imgLogo.style.display = 'block';
          iconLogo.style.display = 'none';
          logoBox.style.display = 'flex';
        } else if (data.logoIcon) {
          iconLogo.className = data.logoIcon + ' logo-icon';
          iconLogo.style.display = 'block';
          imgLogo.style.display = 'none';
          logoBox.style.display = 'flex';
        } else {
          logoBox.style.display = 'none';
        }
      }
    });

    /* Global Audio Controller */
    document.addEventListener("DOMContentLoaded", () => {
      const audio = document.getElementById("bg-audio");
      const audioSource = document.getElementById("audio-source");
      const playerTitle = document.getElementById("player-music-link");
      const playerStatus = document.getElementById("player-status-text");
      const statusDot = document.getElementById("status-dot");
      const playerBtn = document.getElementById("player-btn");
      const playerIcon = document.getElementById("player-icon");
      const volumeSlider = document.getElementById("volume-slider");

      audioSource.src = MUSIC_CONFIG.musicFile;
      audio.load();
      playerTitle.innerText = MUSIC_CONFIG.songTitle;
      playerTitle.href = MUSIC_CONFIG.originalUrl;

      const savedVolume = localStorage.getItem("music_volume");
      if (savedVolume !== null) { audio.volume = parseFloat(savedVolume); volumeSlider.value = savedVolume; }

      const savedTime = localStorage.getItem("music_time");
      if (savedTime !== null) { audio.currentTime = parseFloat(savedTime); }

      audio.addEventListener("timeupdate", () => {
        localStorage.setItem("music_time", audio.currentTime);
      });

      function playMusic() {
        audio.play().then(() => {
          playerIcon.className = "fa-solid fa-pause";
          playerStatus.innerText = "PLAYING";
          statusDot.classList.add("active");
          localStorage.setItem("music_player_state", "playing");
          sessionStorage.setItem("music_user_stopped", "false");
        }).catch(() => {});
      }

      function pauseMusic() {
        audio.pause();
        playerIcon.className = "fa-solid fa-play";
        playerStatus.innerText = "STOPPED";
        statusDot.classList.remove("active");
        localStorage.setItem("music_player_state", "stopped");
        sessionStorage.setItem("music_user_stopped", "true");
      }

      const isStoppedByUser = sessionStorage.getItem("music_user_stopped") === "true";
      const globalState = localStorage.getItem("music_player_state");

      if (!isStoppedByUser) {
        playMusic();
        const startOnInteraction = (e) => {
          if (e.target.closest('#player-btn') || e.target.closest('#volume-slider') || e.target.closest('#admin-modal')) return;
          if (audio.paused && sessionStorage.getItem("music_user_stopped") !== "true") {
            playMusic();
          }
          document.removeEventListener("click", startOnInteraction);
        };
        document.addEventListener("click", startOnInteraction);
      } else {
        pauseMusic();
      }

      playerBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (audio.paused) {
          playMusic();
        } else {
          pauseMusic();
        }
      });

      volumeSlider.addEventListener("input", (e) => {
        audio.volume = parseFloat(e.target.value);
        localStorage.setItem("music_volume", e.target.value);
      });
    });

    function openAdminModal() { document.getElementById('admin-modal').style.display = 'flex'; }
    function closeAdminModal() { document.getElementById('admin-modal').style.display = 'none'; }
    function handleAdminLogin() {
      const email = document.getElementById('admin-email').value;
      const pass = document.getElementById('admin-password').value;
      firebase.auth().signInWithEmailAndPassword(email, pass)
        .then(() => { window.location.href = "admin.html"; })
        .catch(err => alert("เข้าสู่ระบบไม่สำเร็จ: " + err.message));
    }
  </script>
</body>
</html>
