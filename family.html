<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FAMILY MEMBERS - SIXTYEIGHT 68</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background-color: #050505;
      color: #ffffff;
      position: relative;
      overflow-x: hidden;
      padding-bottom: 85px;
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.08) 0%, rgba(5, 5, 5, 0.98) 75%);
      z-index: 1;
      pointer-events: none;
    }

    #particles-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #cccccc;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 18px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      backdrop-filter: blur(12px);
    }

    .btn-back:hover {
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.15);
      transform: translateX(-4px);
    }

    .header-title { text-align: center; margin-bottom: 30px; }

    .main-title {
      font-family: 'Bebas Neue', cursive;
      font-size: clamp(2.8rem, 5.5vw, 4rem);
      letter-spacing: 5px;
      background: linear-gradient(180deg, #ffffff 0%, #888888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }

    .sub-title { color: #888888; letter-spacing: 4px; font-size: 0.9rem; text-transform: uppercase; margin-top: -2px; }

    .search-box-wrapper {
      max-width: 480px;
      margin: 0 auto 40px auto;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 12px 18px 12px 48px;
      background: rgba(20, 20, 20, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      backdrop-filter: blur(12px);
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    .search-input:focus {
      border-color: #ffffff;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.3);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: #888888;
      font-size: 1rem;
    }

    .category-section { 
      margin-bottom: 45px; 
      transition: opacity 0.4s ease, transform 0.4s ease;
      display: none; /* ซ่อนเริ่มต้นไว้ก่อน */
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .category-title { font-family: 'Bebas Neue', cursive; font-size: 1.8rem; letter-spacing: 2px; color: #ffffff; }

    .member-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }

    .member-card {
      background: rgba(20, 20, 20, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      backdrop-filter: blur(12px);
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      overflow: hidden;
    }

    .member-card:hover {
      transform: translateY(-5px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 28px rgba(255, 255, 255, 0.1);
      background: rgba(30, 30, 30, 0.85);
    }

    .avatar-wrapper {
      position: relative;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      padding: 3px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease;
    }

    .member-card:hover .avatar-wrapper { transform: scale(1.06); }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      background-color: #111;
      filter: grayscale(20%);
      transition: filter 0.3s ease;
    }

    .member-card:hover .avatar-img { filter: grayscale(0%); }

    .member-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .rank-badge {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      padding: 3px 12px;
      border-radius: 14px;
      text-transform: uppercase;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #dddddd;
    }

    .btn-facebook {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 8px 0;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
    }

    .btn-facebook:hover {
      background: #cccccc;
      color: #000000;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(255, 255, 255, 0.3);
    }

    .boss .avatar-wrapper { border: 2px solid #ffffff; box-shadow: 0 0 12px rgba(255, 255, 255, 0.4); }
    .boss .rank-badge { background: #ffffff; color: #000000; font-weight: 700; }

    .leader .avatar-wrapper { border: 2px solid #cccccc; box-shadow: 0 0 10px rgba(204, 204, 204, 0.3); }
    .leader .rank-badge { border-color: #cccccc; color: #ffffff; }

    .support .avatar-wrapper { border: 2px solid #888888; }
    .support .rank-badge { border-color: #888888; color: #aaaaaa; }

    .member .avatar-wrapper { border: 2px solid #555555; }
    .member .rank-badge { border-color: #555555; color: #888888; }

    .no-results { text-align: center; padding: 40px; color: #888888; font-size: 1rem; display: none; }

    /* Player */
    .audio-player-box {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 8px 8px;
      background: rgba(15, 15, 15, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s ease;
    }

    .audio-player-box:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.4); }

    .player-cover-wrapper {
      position: relative;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
    }

    .player-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      filter: grayscale(100%);
      animation: spinCover 10s linear infinite;
      animation-play-state: paused;
    }

    .player-cover-img.playing { animation-play-state: running; filter: grayscale(0%); }

    @keyframes spinCover { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .player-info { display: flex; flex-direction: column; justify-content: center; max-width: 110px; text-align: left; }
    .player-title { font-size: 0.8rem; font-weight: 600; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none; }
    .player-status { font-size: 0.62rem; color: #888888; letter-spacing: 1px; text-transform: uppercase; }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .volume-icon { font-size: 0.7rem; color: #cccccc; width: 12px; text-align: center; }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 50px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.3);
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    .player-toggle-btn {
      background: #ffffff;
      border: none;
      color: #000000;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .player-toggle-btn:hover { background: #cccccc; transform: scale(1.08); }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>
  <canvas id="particles-canvas"></canvas>

  <div class="container">
    <div class="nav-header">
      <a href="index.html" class="btn-back">
        <i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก
      </a>
    </div>

    <div class="header-title">
      <h1 class="main-title">FAMILY MEMBERS</h1>
      <p class="sub-title"></p>
    </div>

    <div class="search-box-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="search-input" class="search-input" placeholder="ค้นหาชื่อสมาชิกครอบครัว..." onkeyup="filterMembers()">
    </div>

    <div id="members-wrapper">
      <div class="category-section boss" id="section-boss">
        <div class="category-header">
          <i class="fa-solid fa-crown" style="color:#ffffff; font-size: 1.2rem;"></i>
          <h2 class="category-title">THE BOSS</h2>
        </div>
        <div class="member-grid" id="grid-boss"></div>
      </div>

      <div class="category-section leader" id="section-leader">
        <div class="category-header">
          <i class="fa-solid fa-fire" style="color:#ffffff; font-size: 1.2rem;"></i>
          <h2 class="category-title">LEADER</h2>
        </div>
        <div class="member-grid" id="grid-leader"></div>
      </div>

      <div class="category-section support" id="section-support">
        <div class="category-header">
          <i class="fa-solid fa-shield-halved" style="color:#ffffff; font-size: 1.2rem;"></i>
          <h2 class="category-title">SUPPORT</h2>
        </div>
        <div class="member-grid" id="grid-support"></div>
      </div>

      <div class="category-section member" id="section-member">
        <div class="category-header">
          <i class="fa-solid fa-user-group" style="color:#ffffff; font-size: 1.2rem;"></i>
          <h2 class="category-title">MEMBER</h2>
        </div>
        <div class="member-grid" id="grid-member"></div>
      </div>

      <div id="no-results" class="no-results">ไม่พบรายชื่อสมาชิกที่ค้นหา</div>
    </div>
  </div>

  <audio id="bg-audio" loop preload="auto">
    <source id="audio-source" src="" type="audio/mpeg">
  </audio>

  <div class="audio-player-box">
    <div class="player-cover-wrapper">
      <img id="player-cover" src="cover.png" alt="Music Cover" class="player-cover-img">
    </div>
    <div class="player-info">
      <a id="player-music-link" href="#" target="_blank" class="player-title">กำลังโหลด...</a>
      <span id="player-status-text" class="player-status">STOPPED</span>
    </div>

    <div class="volume-box">
      <i id="volume-icon" class="fa-solid fa-volume-high volume-icon"></i>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
    </div>

    <button id="player-btn" class="player-toggle-btn" aria-label="Toggle Music">
      <i id="player-icon" class="fa-solid fa-play"></i>
    </button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const MUSIC_CONFIG = {
      songTitle: "NASTY BABE - ПАТРИКИ (Lyric video, 2025)",
      originalUrl: "https://youtu.be/aiigklosh-w?si=SrebT61qHH8B3WsD",
      musicFile: "music.mp3",
      coverImage: "cover.png"
    };

    /* Background Particle Effect */
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : canvas.height + 10;
        this.radius = Math.random() * 1.8 + 0.5;
        this.speedY = Math.random() * 0.5 + 0.2;
        this.speedX = (Math.random() - 0.5) * 0.3;
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update() { this.y -= this.speedY; this.x += this.speedX; if (this.y < -10) this.reset(false); }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.shadowBlur = 8;
        ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
        ctx.fill();
        ctx.closePath();
      }
    }
    for (let i = 0; i < 50; i++) particles.push(new Particle());
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    /* Audio Player Script */
    document.addEventListener("DOMContentLoaded", () => {
      const audio = document.getElementById("bg-audio");
      const audioSource = document.getElementById("audio-source");
      const playerCover = document.getElementById("player-cover");
      const playerTitle = document.getElementById("player-music-link");
      const playerStatus = document.getElementById("player-status-text");
      const playerBtn = document.getElementById("player-btn");
      const playerIcon = document.getElementById("player-icon");
      const volumeSlider = document.getElementById("volume-slider");

      audioSource.src = MUSIC_CONFIG.musicFile;
      audio.load();
      playerCover.src = MUSIC_CONFIG.coverImage;
      playerTitle.innerText = MUSIC_CONFIG.songTitle;
      playerTitle.href = MUSIC_CONFIG.originalUrl;

      const savedVolume = localStorage.getItem("music_volume");
      if (savedVolume !== null) { audio.volume = parseFloat(savedVolume); volumeSlider.value = savedVolume; }
      else { audio.volume = 0.5; volumeSlider.value = 0.5; }

      const savedTime = localStorage.getItem("music_current_time");
      if (savedTime !== null) { audio.currentTime = parseFloat(savedTime); }

      setInterval(() => {
        if (!audio.paused) localStorage.setItem("music_current_time", audio.currentTime);
      }, 500);

      function playMusic() {
        audio.play().then(() => {
          playerIcon.className = "fa-solid fa-pause";
          playerStatus.innerText = "PLAYING";
          playerStatus.style.color = "#ffffff";
          playerCover.classList.add("playing");
          localStorage.setItem("music_player_state", "playing");
        }).catch(err => console.log("Click to play waiting"));
      }

      function pauseMusic() {
        audio.pause();
        playerIcon.className = "fa-solid fa-play";
        playerStatus.innerText = "STOPPED";
        playerStatus.style.color = "#888888";
        playerCover.classList.remove("playing");
        localStorage.setItem("music_player_state", "stopped");
      }

      const handleGlobalClick = (e) => {
        if (!e.target.closest(".audio-player-box")) {
          if (localStorage.getItem("music_player_state") !== "stopped" && audio.paused) {
            playMusic();
          }
        }
      };
      document.addEventListener("click", handleGlobalClick);

      if (localStorage.getItem("music_player_state") !== "stopped") playMusic();
      else pauseMusic();

      playerBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (audio.paused) playMusic();
        else pauseMusic();
      });

      volumeSlider.addEventListener("input", (e) => {
        const val = parseFloat(e.target.value);
        audio.volume = val;
        localStorage.setItem("music_volume", val);
      });
      volumeSlider.addEventListener("click", (e) => e.stopPropagation());
    });

    /* Render Members & Hide Empty Sections Logic */
    function renderMembers(dataList) {
      document.getElementById('grid-boss').innerHTML = '';
      document.getElementById('grid-leader').innerHTML = '';
      document.getElementById('grid-support').innerHTML = '';
      document.getElementById('grid-member').innerHTML = '';

      dataList.forEach(m => {
        const roleLower = (m.role || 'member').toLowerCase();
        const gridElement = document.getElementById(`grid-${roleLower}`);
        if (!gridElement) return;

        const cardHtml = `
          <div class="member-card ${roleLower}" data-name="${(m.name || '').toLowerCase()}">
            <div class="avatar-wrapper">
              <img src="${m.avatar || 'https://via.placeholder.com/100'}" alt="${m.name}" class="avatar-img">
            </div>
            <div class="member-name">${m.name}</div>
            <div class="rank-badge">${roleLower.toUpperCase()}</div>
            <a href="${m.facebook || '#'}" target="_blank" class="btn-facebook">
              <i class="fa-brands fa-facebook-f"></i> Facebook
            </a>
          </div>
        `;
        gridElement.insertAdjacentHTML('beforeend', cardHtml);
      });

      filterMembers(); // เรียกฟิลเตอร์เพื่อซ่อนหมวดที่ไม่มีคนทันที
    }

    function filterMembers() {
      const keyword = document.getElementById('search-input').value.toLowerCase().trim();
      const cards = document.querySelectorAll('.member-card');
      let totalVisible = 0;

      cards.forEach(card => {
        const name = card.getAttribute('data-name');
        if (name.includes(keyword)) {
          card.style.display = 'flex';
          totalVisible++;
        } else {
          card.style.display = 'none';
        }
      });

      ['boss', 'leader', 'support', 'member'].forEach(role => {
        const section = document.getElementById(`section-${role}`);
        const visibleCards = section.querySelectorAll(`.member-card[style*="display: flex"]`);
        // แสดงเฉพาะหมวดที่มีสมาชิกอยู่ข้างใน
        section.style.display = (visibleCards.length > 0) ? "block" : "none";
      });

      document.getElementById('no-results').style.display = (totalVisible === 0) ? 'block' : 'none';
    }

    /* Firebase Sync */
    const firebaseConfig = {
      apiKey: "AIzaSyAHPEF07_zyE7hwZRPIBbwV_ewTz-xzdRo",
      authDomain: "sixtyeight-68.firebaseapp.com",
      projectId: "sixtyeight-68",
      storageBucket: "sixtyeight-68.firebasestorage.app",
      messagingSenderId: "736729322969",
      appId: "1:736729322969:web:cfa26d6e4be992ffd7f5c8"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("family_members").onSnapshot((snapshot) => {
      const liveMembers = [];
      if (!snapshot.empty) {
        snapshot.forEach(doc => liveMembers.push(doc.data()));
      }
      renderMembers(liveMembers);
    });
  </script>
</body>
</html>
