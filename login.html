<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    width:100%;
    height:100vh;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            #202020 0%,
            #090909 45%,
            #020202 100%
        );

    color:white;

    font-family:
        Arial,
        sans-serif;

    display:flex;

    align-items:center;

    justify-content:center;
}


.login{

    width:360px;

    padding:40px;

    background:
        rgba(20,20,20,.75);

    border:
        1px solid
        rgba(255,255,255,.12);

    border-radius:16px;

    backdrop-filter:blur(15px);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.6);

}


.logo{

    text-align:center;

    margin-bottom:30px;
}


.logo strong{

    display:block;

    font-size:38px;

    font-weight:900;

}


.logo span{

    font-size:8px;

    letter-spacing:5px;

    color:#777;

}


input{

    width:100%;

    height:48px;

    margin-bottom:12px;

    padding:0 15px;

    border-radius:7px;

    border:
        1px solid
        rgba(255,255,255,.1);

    outline:none;

    background:#0b0b0b;

    color:white;

}


input:focus{

    border-color:
        rgba(255,255,255,.4);

}


button{

    width:100%;

    height:48px;

    border:0;

    border-radius:7px;

    background:#fff;

    color:#000;

    font-weight:700;

    cursor:pointer;

    transition:.3s;

}


button:hover{

    transform:translateY(-2px);

    box-shadow:
        0 10px 30px
        rgba(255,255,255,.12);

}


.error{

    min-height:20px;

    margin-top:15px;

    text-align:center;

    font-size:11px;

    color:#ff6b6b;

}


.back{

    display:block;

    margin-top:20px;

    text-align:center;

    color:#555;

    text-decoration:none;

    font-size:10px;

}

</style>

</head>


<body>


<div class="login">

    <div class="logo">

        <strong>9841</strong>

        <span>ADMIN PANEL</span>

    </div>


    <input
        id="email"
        type="email"
        placeholder="Email"
    >


    <input
        id="password"
        type="password"
        placeholder="Password"
    >


    <button id="login">

        LOGIN

    </button>


    <div
        class="error"
        id="error"
    ></div>


    <a
        href="index.html"
        class="back"
    >

        ← BACK TO WEBSITE

    </a>

</div>


<script type="module">

import {
    initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    signInWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAHPEF07_zyE7hwZRPIBbwV_ewTz-xzdRo",

    authDomain:
        "sixtyeight-68.firebaseapp.com",

    projectId:
        "sixtyeight-68",

    storageBucket:
        "sixtyeight-68.firebasestorage.app",

    messagingSenderId:
        "736729322969",

    appId:
        "1:736729322969:web:cfa26d6e4be992ffd7f5c8"

};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


/* =========================================
   LOGIN
========================================= */

document
.getElementById("login")
.addEventListener(
    "click",
    async () => {

        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const error =
            document
            .getElementById("error");


        error.textContent = "";


        if(
            !email ||
            !password
        ){

            error.textContent =
                "กรุณากรอก Email และ Password";

            return;

        }


        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            window.location.href =
                "admin.html";


        }catch(e){

            error.textContent =
                "Email หรือ Password ไม่ถูกต้อง";

            console.error(e);

        }

    }
);

</script>

</body>
</html>
